[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-work-runtime"
version = "0.1.0"
description = "Durable work orchestration runtime for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Work Runtime Contributors" }]
keywords = ["ai", "agents", "workflow", "runtime", "scheduler"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
awr = "awr.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
